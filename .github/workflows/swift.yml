name: Swift
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: "xcode-27"
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=macOS"
            platform: ""
          - destination: "generic/platform=iOS"
            platform: "iOS"
          - destination: "generic/platform=xrOS"
            platform: "visionOS"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download platform (${{ matrix.platform }})
        if: matrix.platform != ''
        run: |
          for i in 1 2 3; do
            xcodebuild -downloadPlatform ${{ matrix.platform }} && exit 0
            echo "downloadPlatform attempt $i failed; retrying in 30s"; sleep 30
          done
          exit 1
      - name: Download MetalToolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Trust plugins
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
      - name: Build (${{ matrix.destination }})
        run: |
          xcodebuild build \
            -project Radiance.xcodeproj \
            -scheme Radiance \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
